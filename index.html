  <style>
    :root{--gold:#d49b35;--gold2:#ffe7a4;--bronze:#8d5a12;--bg:#050505;--text:#f5efe5;--muted:rgba(245,239,229,.72)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{margin:0;background:#050505;color:var(--text);font-family:Inter,Manrope,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}.app{min-height:100svh;background:radial-gradient(circle at 50% 0,rgba(212,155,53,.18),transparent 40%),#070707;display:flex;justify-content:center}.phone{width:100%;max-width:430px;min-height:100svh;position:relative;background:radial-gradient(circle at 50% 0,rgba(212,155,53,.14),transparent 35%),#050505;overflow:hidden}.splash{min-height:100svh;display:grid;place-items:center;padding:82px 28px 38px;background:radial-gradient(circle at 50% 36%,rgba(218,166,65,.18),transparent 38%),#000;animation:fade .9s ease}.lang{position:absolute;top:18px;right:16px;display:flex;gap:7px;z-index:5}.lang button{height:34px;min-width:42px;border-radius:999px;border:1px solid rgba(218,166,65,.45);background:rgba(255,255,255,.04);color:rgba(245,239,229,.62);font-weight:900;font-size:11px}.lang button.active{color:#1a1003;background:linear-gradient(180deg,var(--gold2),var(--gold) 65%,var(--bronze));box-shadow:0 0 20px rgba(212,155,53,.45)}.splashInner{text-align:center;width:100%}.logoMain{width:84%;max-width:335px;display:block;margin:0 auto 58px;object-fit:contain;filter:brightness(1.45) saturate(1.45) drop-shadow(0 0 36px rgba(255,205,87,.55));animation:logoPulse 3.3s ease-in-out infinite}.splash h1{margin:0;font-size:36px;line-height:1.08;font-weight:950;letter-spacing:-1px;text-transform:uppercase}.splash p{margin:30px auto 0;max-width:340px;color:var(--muted);font-size:19px;line-height:1.5}.ref{display:block;color:var(--gold);letter-spacing:4px;font-weight:950;margin:22px 0 42px}.goldBtn{width:100%;min-height:64px;border:0;border-radius:999px;background:linear-gradient(180deg,var(--gold2),var(--gold) 68%,var(--bronze));color:#1a1003;font-size:18px;font-weight:950;letter-spacing:2px;box-shadow:0 18px 48px rgba(212,155,53,.34);display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}.top{height:92px;padding:22px 18px 10px;display:flex;align-items:center;justify-content:space-between}.smallLogo{width:76px;filter:brightness(1.4) saturate(1.45) drop-shadow(0 0 14px rgba(255,205,87,.36))}.pill{height:41px;border-radius:999px;border:1px solid rgba(212,155,53,.62);background:rgba(212,155,53,.08);color:var(--gold2);font-weight:900;padding:0 13px;display:flex;align-items:center;gap:6px}.content{height:calc(100svh - 192px);overflow:auto;padding:24px 22px 34px}.stack{display:grid;gap:18px}.card,.feature,.mission,.viewer,.stat,.road,.ach{border-radius:30px;padding:26px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 0 44px rgba(255,255,255,.018)}.hero,.mission{border-color:rgba(212,155,53,.52);background:radial-gradient(circle at 82% 0,rgba(212,155,53,.22),transparent 42%),rgba(14,14,14,.92)}.kicker{color:var(--gold);font-size:12px;letter-spacing:3px;font-weight:950;text-transform:uppercase;margin:0 0 18px}.card h2,.hero h2,.mission h2{margin:0 0 20px;font-size:33px;line-height:1.08;font-weight:950;letter-spacing:-1px}.mission h2{font-size:46px}.card p,.hero p,.feature p,.mission p,.stat p,.road p{margin:0;color:var(--muted);font-size:17px;line-height:1.55}.goldText{display:block;color:var(--gold);font-size:20px;line-height:1.45;margin-top:20px;font-weight:850}.grid{display:grid;gap:14px}.feature{width:100%;text-align:left;cursor:pointer;display:flex;gap:17px;align-items:flex-start;color:var(--text)}.featureIcon{width:46px;height:46px;border-radius:999px;background:rgba(212,155,53,.12);border:1px solid rgba(212,155,53,.45);color:var(--gold);display:grid;place-items:center;flex-shrink:0;font-size:24px}.feature h3{margin:0 0 8px;font-size:21px}.outline{width:100%;min-height:58px;border-radius:999px;border:1px solid rgba(212,155,53,.62);background:rgba(212,155,53,.08);color:var(--gold2);font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none}.bottom{height:100px;border-top:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.94);display:grid;grid-template-columns:repeat(6,1fr);padding:12px 6px 18px;position:absolute;bottom:0;left:0;right:0}.bottom button{border:0;background:transparent;color:rgba(245,239,229,.48);display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;font-size:10.5px}.bottom button.active{color:var(--gold)}.bottom .ico{font-size:24px}.request{display:grid;gap:12px}input,textarea{width:100%;border-radius:22px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.055);color:var(--text);padding:17px;font-size:16px;outline:none}textarea{min-height:150px;resize:none}.toast{position:absolute;left:18px;right:18px;bottom:112px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1003;padding:15px;border-radius:20px;text-align:center;font-weight:950;z-index:30}.viewerTop{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.viewerTop h2{margin:0;font-size:27px;line-height:1.1}.viewerTop span{color:var(--gold);font-weight:950}.magPage{width:100%;display:block;border-radius:22px;border:1px solid rgba(212,155,53,.35);background:#111}.magCtrl{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.magCtrl button{width:58px;height:48px;border-radius:999px;border:1px solid rgba(212,155,53,.55);background:rgba(212,155,53,.1);color:var(--gold2);font-size:23px}.magCtrl button:disabled{opacity:.3}.magCtrl p{color:var(--gold);font-weight:950}.mission{position:relative;overflow:hidden}.dots{position:absolute;top:22px;right:28px;color:rgba(212,155,53,.35);font-size:36px;letter-spacing:7px}.bolt{position:absolute;right:34px;bottom:36px;color:rgba(212,155,53,.55);font-size:44px}.hash{position:absolute;left:26px;bottom:20px;color:rgba(255,255,255,.06);font-size:90px;font-weight:950}.prog{height:11px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;margin:26px 0 12px}.prog div{height:100%;width:42%;background:linear-gradient(90deg,var(--bronze),var(--gold2),var(--gold));border-radius:999px}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--gold);font-size:12px;font-weight:900}.level{display:flex;justify-content:space-between;gap:18px;align-items:center}.badge{width:74px;height:74px;border-radius:24px;background:linear-gradient(180deg,var(--gold2),var(--gold) 68%,var(--bronze));color:#1a1003;display:grid;place-items:center;font-size:24px;font-weight:950;flex-shrink:0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stat span{font-size:26px}.stat strong{display:block;margin:12px 0 5px;color:var(--gold2);font-size:34px;font-weight:950}.roadPoint{display:flex;gap:16px;padding:16px 0;border-top:1px solid rgba(255,255,255,.08)}.roadNum{width:48px;height:48px;border-radius:999px;border:1px solid rgba(212,155,53,.45);display:grid;place-items:center;font-weight:950;flex-shrink:0}.roadPoint.active .roadNum{background:var(--gold);color:#1a1003}.achGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.achItem{padding:18px;border-radius:22px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);text-align:center;color:rgba(245,239,229,.55)}.achItem.active{border-color:rgba(212,155,53,.55);color:var(--gold2);background:rgba(212,155,53,.1)}.achItem span{font-size:28px}.hidden{display:none!important}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes logoPulse{0%,100%{transform:scale(1);filter:brightness(1.45) saturate(1.4) drop-shadow(0 0 26px rgba(255,205,87,.42))}50%{transform:scale(1.035);filter:brightness(1.65) saturate(1.6) drop-shadow(0 0 46px rgba(255,205,87,.72))}}
  </style>

<body>
<div class="app"><main class="phone" id="app"></main></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const L={ru:{code:'RU',start:'НАЧАТЬ',back:'Back',mission:'ТВОЯ ЖИЗНЬ — ТВОЯ МИССИЯ',verseText:'Ибо мы — Его творение, созданные во Христе Иисусе на добрые дела.',verse:'ЕФЕСЯНАМ 2:10',home:'Главная',day:'День',journal:'Журнал',path:'Путь',support:'Поддержка',profile:'Мой путь',today:'Сегодня',prayer:'Молитва дня',decl:'Провозглашение дня',step:'Шаг дня',share:'Поделиться',open:'Открыть',jmonth:'Журнал месяца',download:'Скачать журнал',supportTitle:'Молитвенная поддержка',supportText:'Если тебе тяжело — ты не один. Бог рядом.',name:'Твоё имя',need:'Напиши молитвенную нужду...',send:'Отправить',sent:'Молитвенная нужда сохранена. Мы будем молиться.',done:'Готово',copied:'Ссылка скопирована'},uk:{code:'UA',start:'ПОЧАТИ',back:'Back',mission:'ТВОЄ ЖИТТЯ — ТВОЯ МІСІЯ',verseText:'Бо ми — Його творіння, створені в Христі Ісусі на добрі діла.',verse:'ЕФЕСЯН 2:10',home:'Головна',day:'День',journal:'Журнал',path:'Шлях',support:'Підтримка',profile:'Мій шлях',today:'Сьогодні',prayer:'Молитва дня',decl:'Проголошення дня',step:'Крок дня',share:'Поділитися',open:'Відкрити',jmonth:'Журнал місяця',download:'Завантажити журнал',supportTitle:'Молитовна підтримка',supportText:'Якщо тобі важко — ти не сам. Бог поруч.',name:'Твоє ім’я',need:'Напиши молитовну потребу...',send:'Надіслати',sent:'Молитовну потребу збережено. Ми будемо молитися.',done:'Готово',copied:'Посилання скопійовано'},en:{code:'EN',start:'START',back:'Back',mission:'YOUR LIFE — YOUR MISSION',verseText:'For we are His workmanship, created in Christ Jesus for good works.',verse:'EPHESIANS 2:10',home:'Home',day:'Day',journal:'Magazine',path:'Path',support:'Support',profile:'My path',today:'Today',prayer:'Prayer of the day',decl:'Declaration of the day',step:'Step of the day',share:'Share',open:'Open',jmonth:'Monthly magazine',download:'Download magazine',supportTitle:'Prayer support',supportText:'If life is hard — you are not alone. God is near.',name:'Your name',need:'Write your prayer request...',send:'Send',sent:'Prayer request saved. We will pray.',done:'Done',copied:'Link copied'}};
const DAILY=[{ru:['Ефесянам 2:10','Мы — Его творение, созданные во Христе Иисусе на добрые дела.','Господь, сегодня я прихожу к Тебе с открытым сердцем. Помоги мне увидеть, что моя жизнь не случайна. Напомни мне, что я создан Тобой, что во мне есть ценность, дары и предназначение. Направь мои мысли, слова и решения. Помоги мне сделать хотя бы один шаг веры, который приблизит меня к Твоему плану. Убери страх, сравнение и сомнения. Наполни меня миром, силой и пониманием моей миссии. Аминь.','Я не случайность. Я Божье творение. Во Христе моя жизнь имеет смысл, направление и миссию.','Сделай сегодня одно доброе дело осознанно и посвяти его Богу.'],uk:['Ефесян 2:10','Ми — Його творіння, створені в Христі Ісусі на добрі діла.','Господи, сьогодні я приходжу до Тебе з відкритим серцем. Допоможи мені побачити, що моє життя не випадкове. Нагадай мені, що я створений Тобою, що в мені є цінність, дари і призначення. Направ мої думки, слова і рішення. Допоможи мені зробити хоча б один крок віри, який наблизить мене до Твого плану. Амінь.','Я не випадковість. Я Боже творіння. У Христі моє життя має сенс, напрямок і місію.','Зроби сьогодні одну добру справу свідомо і присвяти її Богові.'],en:['Ephesians 2:10','We are His workmanship, created in Christ Jesus for good works.','Lord, today I come to You with an open heart. Help me see that my life is not an accident. Remind me that I was created by You, that there is value, gifts, and purpose inside of me. Guide my thoughts, words, and decisions. Help me take at least one step of faith that brings me closer to Your plan. Amen.','I am not an accident. I am God’s workmanship. In Christ, my life has meaning, direction, and mission.','Do one intentional good deed today and dedicate it to God.']},{ru:['Исаия 41:10','Не бойся, ибо Я с тобою.','Господь, я отдаю Тебе свои страхи. Иногда я не понимаю, что будет дальше, и моё сердце тревожится. Но сегодня я выбираю доверять Тебе больше, чем своим переживаниям. Укрепи мою веру и дай мужество сделать следующий шаг. Аминь.','Страх не управляет моей жизнью. Бог со мной, Он укрепляет меня и ведёт дальше.','Назови один страх и в молитве отдай его Богу.'],uk:['Ісая 41:10','Не бійся, бо Я з тобою.','Господи, я віддаю Тобі свої страхи. Іноді я не розумію, що буде далі, і моє серце тривожиться. Але сьогодні я обираю довіряти Тобі більше, ніж своїм переживанням. Амінь.','Страх не керує моїм життям. Бог зі мною і веде мене далі.','Назви один страх і віддай його Богові.'],en:['Isaiah 41:10','Do not fear, for I am with you.','Lord, I give You my fears. Sometimes I do not understand what comes next and my heart becomes anxious. Today I choose to trust You more than my emotions. Strengthen my faith and give me courage. Amen.','Fear does not control my life. God is with me and leads me forward.','Name one fear and give it to God in prayer.']}];
let state={lang:localStorage.hp_lang||'ru',started:localStorage.hp_started==='1',tab:'home',detail:null,page:1,requests:JSON.parse(localStorage.hp_prayer_requests||'[]')};
function t(){return L[state.lang]} function daily(){let d=new Date().getDate();let a=DAILY[(d-1)%DAILY.length][state.lang];return{verse:a[0],verseText:a[1],prayer:a[2],decl:a[3],step:a[4]}}
function save(){localStorage.hp_lang=state.lang;localStorage.hp_started=state.started?'1':'0'}
function toast(x){let el=document.createElement('div');el.className='toast';el.textContent=x;app.appendChild(el);setTimeout(()=>el.remove(),2400)}
function share(){let url=location.origin;let text=`Happy People\n${t().mission}\n${url}`; if(navigator.share) navigator.share({title:'Happy People',text,url}).catch(()=>{}); else navigator.clipboard.writeText(text).then(()=>toast(t().copied));}
function shell(inner,nav=true){return `<header class="top"><button class="pill" onclick="back()">‹ ${t().back}</button><img src="/assets/logo.png" class="smallLogo"/><button class="pill" onclick="share()">🔗 hp/app</button></header><div class="content">${inner}</div>${nav?bottom():''}`}
function splash(){app.innerHTML=`<section class="splash"><div class="lang">${['ru','uk','en'].map(k=>`<button class="${state.lang===k?'active':''}" onclick="setLang('${k}')">${L[k].code}</button>`).join('')}</div><div class="splashInner"><img src="/assets/logo.png" class="logoMain"/><h1>${t().mission}</h1><p>${t().verseText}</p><span class="ref">${t().verse}</span><button class="goldBtn" onclick="start()">${t().start}</button></div></section>`}
function start(){state.started=true;save();render()} function setLang(k){state.lang=k;save();render()} function back(){if(state.detail){state.detail=null}else{state.started=false;save()} render()}
function bottom(){let items=[['home','⌂',t().home],['day','📖',t().day],['journal','▤',t().journal],['path','🏆',t().path],['support','♡',t().support],['profile','♙',t().profile]];return `<nav class="bottom">${items.map(i=>`<button class="${state.tab===i[0]?'active':''}" onclick="go('${i[0]}')"><span class="ico">${i[1]}</span><span>${i[2]}</span></button>`).join('')}</nav>`} function go(x){state.tab=x;state.detail=null;render()} function detail(x){state.detail=x;render()}
function feature(ic,title,text,act){return `<button class="feature" onclick="${act}"><div class="featureIcon">${ic}</div><div><h3>${title}</h3><p>${text}</p></div></button>`}
function card(title,text,gold=''){return `<section class="card"><h2>${title}</h2><p>${text}</p>${gold?`<strong class="goldText">${gold}</strong>`:''}</section>`}
function home(){let d=daily();return `<div class="stack"><section class="card hero"><p class="kicker">HAPPYPEOPLE APP • DAILY PATH</p><h2>${t().mission}</h2><p>${t().verseText}</p><button class="goldBtn" onclick="go('day')">${t().open} ${t().day}</button></section><div class="grid">${feature('📖',t().prayer,d.prayer,"detail('prayer')")}${feature('☰',t().decl,d.decl,"detail('decl')")}${feature('⚡',t().step,d.step,"detail('step')")}${feature('▤',t().journal,t().jmonth,"go('journal')")}</div><section class="card"><p class="kicker">${t().today}</p><h2>${d.verse}</h2><p>${d.verseText}</p><strong class="goldText">${d.decl}</strong><button class="outline" onclick="share()">↗ ${t().share}</button></section></div>`}
function day(){let d=daily();return `<div class="stack">${card(t().day,d.verseText,d.verse)}${feature('📖',t().prayer,d.prayer,"detail('prayer')")}${feature('☰',t().decl,d.decl,"detail('decl')")}${feature('⚡',t().step,d.step,"detail('step')")}</div>`}
function details(){let d=daily(), key=state.detail; if(key==='prayer')return `<div class="stack">${card(t().prayer,d.prayer,d.verse)}${card(t().decl,d.decl)}<button class="goldBtn" onclick="toast('${t().done}')">✓ ${t().done}</button><button class="outline" onclick="share()">↗ ${t().share}</button></div>`; if(key==='decl')return `<div class="stack">${card(t().decl,d.decl,d.verse)}<button class="goldBtn" onclick="toast('${t().done}')">✓ ${t().done}</button></div>`; return `<div class="stack">${card(t().step,d.step,d.decl)}<button class="goldBtn" onclick="toast('${t().done}')">✓ ${t().done}</button></div>`}
function journal(){let p=state.page;return `<div class="stack"><section class="viewer"><div class="viewerTop"><div><p class="kicker">HAPPYPEOPLE MAGAZINE</p><h2>Из невидимого в видимое</h2></div><span>${p}/10</span></div><img src="/magazines/july-2026/page-${p}.jpg" class="magPage" alt="Magazine page ${p}" onerror="this.src='/magazines/july-2026/page-1.jpg'"/><div class="magCtrl"><button onclick="prevPage()" ${p===1?'disabled':''}>←</button><p>${p} / 10</p><button onclick="nextPage()" ${p===10?'disabled':''}>→</button></div></section><a class="outline" href="/magazines/july-2026.pdf" download>${t().download}</a></div>`}
function prevPage(){state.page=Math.max(1,state.page-1);render()} function nextPage(){state.page=Math.min(10,state.page+1);render()}
function path(){let arr={ru:[['01','Ты не случайность','Бог создал тебя для миссии.'],['02','Начни с малого','Один маленький шаг веры имеет значение.'],['03','Не сравнивай себя','Твой путь не обязан быть похожим на чужой.']],uk:[['01','Ти не випадковість','Бог створив тебе для місії.'],['02','Почни з малого','Один маленький крок віри має значення.'],['03','Не порівнюй себе','Твій шлях не має бути схожим на чужий.']],en:[['01','You are not an accident','God created you for mission.'],['02','Start small','One small step of faith matters.'],['03','Do not compare','Your path does not have to look like someone else’s.']]}[state.lang];return `<div class="stack">${arr.map(x=>`<section class="road"><div class="roadPoint active"><div class="roadNum">${x[0]}</div><div><h3>${x[1]}</h3><p>${x[2]}</p></div></div></section>`).join('')}</div>`}
function support(){return `<div class="stack">${card(t().supportTitle,t().supportText,t().prayer)}<form class="request" onsubmit="sendReq(event)"><input id="name" placeholder="${t().name}"><textarea id="need" placeholder="${t().need}"></textarea><button class="goldBtn" type="submit">✈ ${t().send}</button></form></div>`} function sendReq(e){e.preventDefault();let name=$('#name').value.trim()||'Happy People', text=$('#need').value.trim(); if(!text)return; state.requests=[{name,text,id:Date.now()},...state.requests]; localStorage.hp_prayer_requests=JSON.stringify(state.requests); toast(t().sent); render()}
function profile(){let tt={ru:['Мой путь','Ты шаг за шагом идёшь к своей миссии.','42% пути','Следующая цель: 30 дней','Карта миссии','Достижения','дней пути','молитвенных нужд','шагов','благодарностей'],uk:['Мій шлях','Ти крок за кроком ідеш до своєї місії.','42% шляху','Наступна ціль: 30 днів','Карта місії','Досягнення','днів шляху','молитовних потреб','кроків','подяк'],en:['My path','Step by step, you are moving toward your mission.','42% complete','Next goal: 30 days','Mission map','Achievements','days','prayer requests','steps','gratitude notes']}[state.lang];return `<div class="stack"><section class="mission"><div class="dots">•••</div><div class="bolt">⚡</div><div class="hash">#</div><p class="kicker">HAPPYPEOPLE JOURNEY</p><h2>${tt[0]}</h2><p>${tt[1]}</p><div class="prog"><div></div></div><div class="meta"><span>${tt[2]}</span><span>${tt[3]}</span></div></section><section class="card level"><div><p class="kicker">LEVEL 01</p><h2>${state.lang==='en'?'Beginning':state.lang==='uk'?'Початок':'Начало пути'}</h2><p>${state.lang==='en'?'Keep going every day.':state.lang==='uk'?'Продовжуй щодня.':'Продолжай каждый день.'}</p></div><div class="badge">01</div></section><div class="stats"><div class="stat"><span>🔥</span><strong>12</strong><p>${tt[6]}</p></div><div class="stat"><span>🙏</span><strong>${state.requests.length}</strong><p>${tt[7]}</p></div><div class="stat"><span>⚡</span><strong>7</strong><p>${tt[8]}</p></div><div class="stat"><span>✦</span><strong>5</strong><p>${tt[9]}</p></div></div><section class="road"><p class="kicker">${tt[4]}</p>${['01 Start','07 Faithfulness','30 Habit','100 Mission'].map((x,i)=>`<div class="roadPoint ${i<2?'active':''}"><div class="roadNum">${x.split(' ')[0]}</div><div><h3>${x.substring(3)}</h3><p>${state.lang==='en'?'Your journey is growing.':state.lang==='uk'?'Твій шлях зростає.':'Твой путь растёт.'}</p></div></div>`).join('')}</section><section class="ach"><p class="kicker">${tt[5]}</p><div class="achGrid"><div class="achItem active"><span>✦</span><p>First step</p></div><div class="achItem active"><span>⚡</span><p>7 days</p></div><div class="achItem"><span>◆</span><p>30 days</p></div><div class="achItem"><span>♛</span><p>100 days</p></div></div></section></div>`}
function render(){if(!state.started)return splash();let body=state.detail?details():({home,day,journal,path,support,profile}[state.tab]||home)();app.innerHTML=shell(body,!state.detail)} render();
</script>
</body></html>
